<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的第一個網站</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #eef6ff;
      font-family: "Microsoft JhengHei", sans-serif;
      color: #243047;
    }

    main {
      width: min(80%, 600px);
      padding: 36px;
      background: white;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 8px 30px #24304715;
    }

    h1 {
      color: #2563eb;
    }
  </style>
</head>
<body>
  <main>
    <h1>歡迎來到我的網站！</h1>
    <p>這是我使用 GitHub Pages 建立的第一個網站。</p>
  </main>
</body>
</html>
